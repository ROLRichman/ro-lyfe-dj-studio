name: RO’Lyfe validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rolyfe-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript module syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in src/*.js; do
            echo "Checking $file"
            node --input-type=module --check < "$file"
          done

      - name: Validate RO’Lyfe feature wiring
        run: node scripts/validate-studio.mjs

      - name: Install Chromium for real browser startup tests
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium

      - name: Verify direct-entry startup on phone, tablet and desktop
        timeout-minutes: 3
        env:
          DJ_STUDIO_BRAND: rolyfe
        run: node scripts/smoke-browser.mjs
